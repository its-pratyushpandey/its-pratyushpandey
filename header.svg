<svg
  width="1200"
  height="400"
  viewBox="0 0 1200 400"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <!-- =========================================================
       DEFINITIONS
  ========================================================== -->

  <defs>

    <!-- Main background -->
    <linearGradient
      id="background"
      x1="0"
      y1="0"
      x2="1200"
      y2="400"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#020409"/>
      <stop offset="50%" stop-color="#080B12"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>

    <!-- Accent gradient -->
    <linearGradient
      id="accent"
      x1="250"
      y1="0"
      x2="950"
      y2="0"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#4F8EF7"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Blue glow -->
    <radialGradient id="blueGlow">
      <stop
        offset="0%"
        stop-color="#4F8EF7"
        stop-opacity="0.18"
      />
      <stop
        offset="100%"
        stop-color="#4F8EF7"
        stop-opacity="0"
      />
    </radialGradient>

    <!-- Purple glow -->
    <radialGradient id="purpleGlow">
      <stop
        offset="0%"
        stop-color="#8B5CF6"
        stop-opacity="0.15"
      />
      <stop
        offset="100%"
        stop-color="#8B5CF6"
        stop-opacity="0"
      />
    </radialGradient>

    <!-- Main glow -->
    <filter
      id="textGlow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
    >
      <feGaussianBlur
        stdDeviation="5"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Small glow -->
    <filter
      id="smallGlow"
      x="-100%"
      y="-100%"
      width="300%"
      height="300%"
    >
      <feGaussianBlur
        stdDeviation="2"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Banner clipping -->
    <clipPath id="bannerClip">
      <rect
        x="0"
        y="0"
        width="1200"
        height="400"
        rx="12"
      />
    </clipPath>

  </defs>


  <!-- =========================================================
       BACKGROUND
  ========================================================== -->

  <rect
    width="1200"
    height="400"
    rx="12"
    fill="url(#background)"
  />

  <!-- Left blue glow -->

  <circle
    cx="80"
    cy="200"
    r="300"
    fill="url(#blueGlow)"
  >
    <animate
      attributeName="opacity"
      values="0.55;1;0.55"
      dur="4s"
      repeatCount="indefinite"
    />
  </circle>


  <!-- Right purple glow -->

  <circle
    cx="1120"
    cy="200"
    r="300"
    fill="url(#purpleGlow)"
  >
    <animate
      attributeName="opacity"
      values="0.55;1;0.55"
      dur="5s"
      repeatCount="indefinite"
    />
  </circle>


  <!-- =========================================================
       PARTICLES
  ========================================================== -->

  <g
    fill="#4F8EF7"
    filter="url(#smallGlow)"
  >

    <!-- Particle 1 -->
    <circle
      cx="100"
      cy="100"
      r="2"
    >
      <animate
        attributeName="cy"
        values="100;45;100"
        dur="5s"
        repeatCount="indefinite"
      />
    </circle>

    <!-- Particle 2 -->
    <circle
      cx="210"
      cy="320"
      r="1.5"
    >
      <animate
        attributeName="cy"
        values="320;260;320"
        dur="6s"
        repeatCount="indefinite"
      />
    </circle>

    <!-- Particle 3 -->
    <circle
      cx="350"
      cy="75"
      r="1.5"
    >
      <animate
        attributeName="cy"
        values="75;30;75"
        dur="4s"
        repeatCount="indefinite"
      />
    </circle>

    <!-- Particle 4 -->
    <circle
      cx="500"
      cy="330"
      r="2"
    >
      <animate
        attributeName="cy"
        values="330;280;330"
        dur="5s"
        repeatCount="indefinite"
      />
    </circle>

    <!-- Particle 5 -->
    <circle
      cx="650"
      cy="55"
      r="1.5"
    >
      <animate
        attributeName="cy"
        values="55;100;55"
        dur="5s"
        repeatCount="indefinite"
      />
    </circle>

    <!-- Particle 6 -->
    <circle
      cx="790"
      cy="90"
      r="2"
    >
      <animate
        attributeName="cy"
        values="90;40;90"
        dur="4.5s"
        repeatCount="indefinite"
      />
    </circle>

    <!-- Particle 7 -->
    <circle
      cx="930"
      cy="315"
      r="1.5"
    >
      <animate
        attributeName="cy"
        values="315;255;315"
        dur="6s"
        repeatCount="indefinite"
      />
    </circle>

    <!-- Particle 8 -->
    <circle
      cx="1050"
      cy="95"
      r="1.5"
    >
      <animate
        attributeName="cy"
        values="95;45;95"
        dur="5s"
        repeatCount="indefinite"
      />
    </circle>

    <!-- Particle 9 -->
    <circle
      cx="1140"
      cy="250"
      r="2"
    >
      <animate
        attributeName="cy"
        values="250;200;250"
        dur="4.5s"
        repeatCount="indefinite"
      />
    </circle>

  </g>


  <!-- =========================================================
       MAIN CONTENT
  ========================================================== -->

  <g
    clip-path="url(#bannerClip)"
    font-family="monospace"
    text-anchor="middle"
  >

    <!-- =======================================================
         TOP LABEL
    ======================================================== -->

    <text
      x="600"
      y="60"
      font-size="16"
      font-weight="500"
      letter-spacing="4"
      fill="#7C8AA5"
    >
      DEVELOPER • AI • FULL STACK
    </text>


    <!-- =======================================================
         MAIN TITLE
    ======================================================== -->

    <text
      x="600"
      y="145"
      font-size="48"
      font-weight="700"
      fill="#FFFFFF"
      filter="url(#textGlow)"
    >
      Hi there, I'm Pratyush Pandey

      <animate
        attributeName="opacity"
        values="0.9;1;0.9"
        dur="2.5s"
        repeatCount="indefinite"
      />
    </text>


    <!-- =======================================================
         WAVING HAND
    ======================================================== -->

    <text
      x="1000"
      y="145"
      font-size="38"
      text-anchor="start"
    >
      👋

      <animateTransform
        attributeName="transform"
        attributeType="XML"
        type="rotate"
        values="
          0 1015 132;
          14 1015 132;
          -8 1015 132;
          14 1015 132;
          -4 1015 132;
          10 1015 132;
          0 1015 132
        "
        dur="2.2s"
        repeatCount="indefinite"
      />

    </text>


    <!-- =======================================================
         DIVIDER
    ======================================================== -->

    <line
      x1="350"
      y1="175"
      x2="850"
      y2="175"
      stroke="url(#accent)"
      stroke-width="2"
      opacity="0.8"
    >

      <animate
        attributeName="x1"
        values="410;350;410"
        dur="3s"
        repeatCount="indefinite"
      />

      <animate
        attributeName="x2"
        values="790;850;790"
        dur="3s"
        repeatCount="indefinite"
      />

    </line>


    <!-- =======================================================
         ROLE / TECH DESCRIPTION
    ======================================================== -->

    <text
      x="600"
      y="215"
      font-size="24"
      font-weight="600"
      fill="#FFFFFF"
    >

      <tspan>
        Fullstack
      </tspan>

      <tspan
        fill="#4F8EF7"
      >
        ⚙
      </tspan>

      <tspan>
        MERN
      </tspan>

      <tspan
        fill="#6B7280"
      >
        |
      </tspan>

      <tspan>
        Spring
      </tspan>

      <tspan
        fill="#6B7280"
      >
        |
      </tspan>

      <tspan>
        AI Engineer
      </tspan>

    </text>


    <!-- =======================================================
         SUBTITLE
    ======================================================== -->

    <text
      x="600"
      y="250"
      font-size="18"
      font-weight="500"
      fill="#AEB8CC"
    >
      Open Source ✨  |  Tech Explorer 🚀
    </text>


    <!-- =======================================================
         TECH STACK
    ======================================================== -->


    <!-- React -->

    <g transform="translate(270,285)">

      <rect
        width="95"
        height="38"
        rx="19"
        fill="#4F8EF7"
        fill-opacity="0.10"
        stroke="#4F8EF7"
        stroke-opacity="0.5"
      />

      <text
        x="47.5"
        y="25"
        font-size="15"
        fill="#FFFFFF"
      >
        React
      </text>

    </g>


    <!-- Spring -->

    <g transform="translate(380,285)">

      <rect
        width="105"
        height="38"
        rx="19"
        fill="#8B5CF6"
        fill-opacity="0.10"
        stroke="#8B5CF6"
        stroke-opacity="0.5"
      />

      <text
        x="52.5"
        y="25"
        font-size="15"
        fill="#FFFFFF"
      >
        Spring
      </text>

    </g>


    <!-- AI / ML -->

    <g transform="translate(500,285)">

      <rect
        width="105"
        height="38"
        rx="19"
        fill="#06B6D4"
        fill-opacity="0.10"
        stroke="#06B6D4"
        stroke-opacity="0.5"
      />

      <text
        x="52.5"
        y="25"
        font-size="15"
        fill="#FFFFFF"
      >
        AI / ML
      </text>

    </g>


    <!-- TypeScript -->

    <g transform="translate(620,285)">

      <rect
        width="125"
        height="38"
        rx="19"
        fill="#4F8EF7"
        fill-opacity="0.10"
        stroke="#4F8EF7"
        stroke-opacity="0.5"
      />

      <text
        x="62.5"
        y="25"
        font-size="15"
        fill="#FFFFFF"
      >
        TypeScript
      </text>

    </g>


    <!-- Next.js -->

    <g transform="translate(760,285)">

      <rect
        width="100"
        height="38"
        rx="19"
        fill="#8B5CF6"
        fill-opacity="0.10"
        stroke="#8B5CF6"
        stroke-opacity="0.5"
      />

      <text
        x="50"
        y="25"
        font-size="15"
        fill="#FFFFFF"
      >
        Next.js
      </text>

    </g>


    <!-- NLP -->

    <g transform="translate(875,285)">

      <rect
        width="75"
        height="38"
        rx="19"
        fill="#06B6D4"
        fill-opacity="0.10"
        stroke="#06B6D4"
        stroke-opacity="0.5"
      />

      <text
        x="37.5"
        y="25"
        font-size="15"
        fill="#FFFFFF"
      >
        NLP
      </text>

    </g>


    <!-- =======================================================
         BOTTOM ACCENT
    ======================================================== -->

    <rect
      x="450"
      y="350"
      width="300"
      height="2"
      rx="1"
      fill="url(#accent)"
      opacity="0.8"
    >

      <animate
        attributeName="width"
        values="220;300;220"
        dur="3s"
        repeatCount="indefinite"
      />

      <animate
        attributeName="x"
        values="490;450;490"
        dur="3s"
        repeatCount="indefinite"
      />

    </rect>


    <!-- =======================================================
         BOTTOM TEXT
    ======================================================== -->

    <text
      x="600"
      y="378"
      font-size="12"
      letter-spacing="2"
      fill="#596579"
    >
      BUILD • LEARN • CREATE • REPEAT
    </text>

  </g>


  <!-- =========================================================
       OUTER BORDER
  ========================================================== -->

  <rect
    x="1"
    y="1"
    width="1198"
    height="398"
    rx="12"
    fill="none"
    stroke="#1F2937"
    stroke-width="2"
  />

</svg>
